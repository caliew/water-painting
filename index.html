<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meditation Space</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font: 14px system-ui, sans-serif;
      color: #e6edf3
    }

    canvas {
      display: block
    }

    #ui {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(380px, 100%);
      box-sizing: border-box;
      padding: 14px;
      background: #10151c;
      overflow: auto
    }

    .card {
      background: #1a222d;
      border-radius: 10px;
      padding: 10px;
      margin: 0 0 10px
    }

    h1 {
      font-size: 17px;
      margin: 0 0 10px
    }

    h2 {
      font-size: 12px;
      margin: 0 0 6px;
      opacity: .7;
      text-transform: uppercase
    }

    button,
    textarea,
    select {
      font: inherit;
      color: inherit;
      background: #243040;
      border: 1px solid #33425a;
      border-radius: 8px;
      padding: 7px 10px
    }

    button.on {
      background: #3ec6a8;
      color: #06201a;
      border-color: #3ec6a8
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 120px
    }

    #bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%)
    }

    #bar button {
      padding: 12px 26px;
      font-size: 17px;
      background: #3ec6a8;
      color: #06201a;
      border: 0
    }

    #st,
    #dbg {
      font: 11px monospace;
      white-space: pre-wrap;
      opacity: .8
    }

    #menuBtn {
      position: fixed;
      left: 10px;
      top: 10px;
      display: none
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>Meditation Space <small id="ver" style="opacity:.6;font-weight:normal"></small></h1>
    <div class="card">
      <h2>Scene</h2>
      <div class="row" id="scn"></div>
    </div>
    <div class="card">
      <h2>Time of day</h2>
      <div class="row" id="tod"></div>
    </div>
    <div class="card">
      <h2>Timer (starts when you enter VR)</h2>
      <div class="row" id="tmr"></div>
    </div>
    <div class="card">
      <h2>Number of walls</h2><select id="walls" style="width:100%">
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option selected>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
      </select>
    </div>
    <div class="card">
      <h2>Starting image (front wall)</h2><select id="start" style="width:100%">
        <option>Looking for images…</option>
      </select>
    </div>
    <div class="card">
      <h2>Rotation speed <span id="rotv"></span></h2><input id="rot" type="range" min="0" max="10" step=".5" value="1"
        style="width:100%">
      <div class="row" style="margin-top:8px"><button id="pz">Pause</button><button id="rv">Direction: left</button>
      </div>
    </div>
    <div class="card">
      <h2>Music mode</h2><div class="row" id="mus"></div>
    </div>
    <div class="card">
      <h2>Volume</h2><input id="vol" type="range" min="0" max="1" step=".05" value=".6" style="width:100%">
    </div>
    <div class="card">
      <h2>Captions: one line per caption, Chinese or English</h2><textarea id="cap"></textarea>
    </div>
    <div class="card">
      <div id="st"></div>
      <div id="dbg"></div>
    </div>
    <button id="hide">Hide menu</button>
  </div>
  <button id="menuBtn">Menu</button>
  <div id="bar"><button id="vr">Enter VR</button></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const VERSION = '2026-11-22 · build 17';
    const EYE = 1.5, SCENES = ['River', 'Mountain'], TODS = ['Dawn', 'Day', 'Dusk', 'Night'], TIMERS = [0, 5, 10, 20];
    // Later: put your own recordings next to index.html, e.g. 'audio/river.mp3'. A set path replaces the synthesized sound.
    const AUDIO_FILES = { river: '', mountain: '' };
    const V3 = THREE.Vector3, v = (a) => new V3(a[0], a[1], a[2]);
    const P = [
      { top: [.62, .70, .78], hor: [.97, .82, .74], ink: [.22, .25, .30], sun: [1, .7, .45], dir: [.3, .12, -1], night: 0 },
      { top: [.55, .72, .82], hor: [.93, .95, .92], ink: [.16, .20, .22], sun: [1, .95, .8], dir: [.2, .6, -.8], night: 0 },
      { top: [.32, .30, .50], hor: [.95, .60, .45], ink: [.18, .15, .20], sun: [1, .5, .3], dir: [-.4, .08, -1], night: 0 },
      { top: [.04, .06, .12], hor: [.16, .20, .30], ink: [.03, .04, .08], sun: [.8, .85, 1], dir: [.3, .45, -.8], night: 1 }
    ].map(p => ({ top: v(p.top), hor: v(p.hor), ink: v(p.ink), sun: v(p.sun), dir: v(p.dir), night: p.night }));
    let rotDeg = 1, sc = 0, pending = null, tod = 1, timerIdx = 0, vol = .6, zenMusicOn = true, inXR = false, eyeY = EYE, frames = 0, lastErr = '', fade = 1, shownUntil = 0;
    let timerEnd = 0, timerDone = false, lines = [], capI = -1, capText = '', CAP_SEC = 14;
    const $ = id => document.getElementById(id);

    /* ---------- renderer ---------- */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, EYE, 0); camera.rotation.order = 'YXZ';
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor');
    document.body.prepend(renderer.domElement);

    /* ---------- ink-wash dome ---------- */
    const ACC = [[.85, .45, .5], [.8, .3, .3], [.9, .5, .3], [.3, .4, .7]].map(v);
    const U = {
      uS: { value: 1 }, uYaw: { value: 0 }, uSlot: { value: -1 }, uSlotA: { value: 1 }, uGal: { value: 0 }, uPaper: { value: new V3(.96, .93, .87) }, uTex: { value: null }, uHas: { value: 0 }, uFwd: { value: new V3(0, 0, -1) }, uTint: { value: new V3(1, 1, 1) }, uZ: { value: 1 }, uAcc: { value: ACC[1].clone() }, uT: { value: 0 }, uFade: { value: 1 }, uSc: { value: 0 }, uNight: { value: 0 },
      uTop: { value: P[1].top.clone() }, uHor: { value: P[1].hor.clone() }, uInk: { value: P[1].ink.clone() }, uSun: { value: P[1].sun.clone() }, uDir: { value: P[1].dir.clone() }
    };
    const FS = `
uniform float uT,uFade,uSc,uNight,uZ,uYaw;uniform vec3 uTop,uHor,uInk,uSun,uDir,uAcc;varying vec3 vD;
#define WR 3.5
#define WH 3.2
uniform sampler2D uTex;uniform float uHas,uGal,uSlot,uSlotA,uS;uniform vec3 uFwd,uTint,uPaper;
vec3 skyTex(vec3 d){
 float a=min(acos(clamp(dot(d,uFwd),-1.,1.))/uZ,3.14159);
 vec3 ax=cross(uFwd,d);float l=length(ax);vec3 dd=d;
 if(l>1e-4){ax/=l;dd=uFwd*cos(a)+cross(ax,uFwd)*sin(a);}
 vec2 uv=vec2(atan(dd.x,-dd.z)/6.2831853+.5,asin(clamp(dd.y,-1.,1.))/3.14159265+.5);
 return texture2D(uTex,uv).rgb;}
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
vec3 tile(float k,float tt,float v){
 vec2 uv=vec2((k+clamp((tt+.25)/1.5,.002,.998))/uGal,clamp(v,.003,.997));vec3 c=texture2D(uTex,uv).rgb;return mix(uPaper,c,abs(k-uSlot)<.5?uSlotA:1.);}
vec3 gallery(vec3 O,vec3 D){
 float R=WR*uS,Hh=WH,Y0=0.;
 float A=max(dot(D.xz,D.xz),1e-5),B=dot(O.xz,D.xz),C=dot(O.xz,O.xz)-R*R;
 float tw=(-B+sqrt(max(B*B-A*C,0.)))/A;
 float tf=-O.y/min(D.y,-1e-4);bool fl=D.y<0.&&tf<tw;
 vec3 P=O+D*tw;
 float cy=cos(uYaw),sy=sin(uYaw);
 vec2 q=vec2(P.x*cy-P.z*sy,P.x*sy+P.z*cy);
 float az=atan(q.x,-q.y)/6.2831853+.5;
 float f=(az-.5)*uGal*uS;
 float i=floor(f+.5),u=f-i+.5,o=.25;
 float k=mod(mod(i,uGal)+uGal,uGal);
 float v=(P.y-Y0)/Hh;
 vec3 c=tile(k,u,v);
 if(u<o)c=mix(c,tile(mod(k+uGal-1.,uGal),u+1.,v),1.-smoothstep(-o,o,u));
 else if(u>1.-o)c=mix(c,tile(mod(k+1.,uGal),u-1.,v),smoothstep(-o,o,u-1.));
 c=mix(c,vec3(dot(c,vec3(.3,.59,.11))),.1);
 float nz=.05*fbm(vec2(az*70.,v*6.));
 float al=smoothstep(0.,.2,v+nz)*smoothstep(0.,.2,1.-v+nz);
 vec3 paper=uPaper*(.95+.1*fbm(vec2(az*9.,v*3.)));
 vec3 res=mix(paper,c*uTint,al);
 if(fl)res=uPaper*(.93+.07*fbm((O+D*tf).xz*.6));
 return res;}
float rg(vec2 dz,float b,float a,float f,float k){return b+a*fbm(dz*f/uZ+k*9.7);}
vec3 layer(vec3 col,vec2 dz,float e,float b,float a,float f,float k,float al){
 float r=rg(dz,b,a,f,k);
 float m=(1.-smoothstep(r-.004,r,e))*smoothstep(-.07,0.,e);
 float rim=smoothstep(r-.03,r,e);
 float tex=.6+.7*fbm(vec2(dz.x*25.+k,e*50.)+e*6.);
 vec3 c=mix(uHor,mix(uInk,uAcc,.5*fbm(dz*7.+k)),clamp(al*tex+rim*.3,0.,1.));
 return mix(col,c,m);}
void main(){
 vec3 d=normalize(vD);d=vec3(d.x*cos(uYaw)-d.z*sin(uYaw),d.y,d.x*sin(uYaw)+d.z*cos(uYaw));float el=d.y,e=el/uZ;vec2 dz=normalize(d.xz+vec2(1e-4));
 if(uHas>.5){gl_FragColor=vec4((uGal>.5?gallery(cameraPosition,normalize(vD-cameraPosition)):skyTex(d)*uTint)*(1.-uFade),1.);return;}
 float b1=fbm(dz*2.5+vec2(el*4.,uT*.01)),b2=fbm(dz*4.+el*7.+9.);
 vec3 col=mix(uHor,uTop,smoothstep(-.02,.9,el));
 col=mix(col,uAcc,.28*smoothstep(.45,.8,b1)*smoothstep(0.,.5,el));
 col=mix(col,vec3(1.),.35*smoothstep(.5,.8,b2));
 float sd=acos(clamp(dot(d,normalize(uDir)),-1.,1.)),R=.17*uZ;
 float disc=1.-smoothstep(R-.015,R,sd+.03*fbm(d.xz*8.+d.y*8.));
 col+=uSun*.12*exp(-sd*3.);
 col=mix(col,mix(uSun,uSun*vec3(1.,.72,.5),fbm(d.xy*12.)),disc*(.9-.3*fbm(d.xz*18.)));
 vec2 g=vec2(atan(d.x,-d.z),el)*28.;
 col=mix(col,uAcc,step(.965,h(floor(g)))*step(length(fract(g)-.5),.12+.2*h(floor(g)+7.))*.85*step(0.,el));
 if(uNight>.01&&el>0.)col+=uNight*step(.993,h(floor(vec2(atan(d.x,-d.z)*70.,el*70.))))*.7;
 if(el<0.){
  float t=1.5/(-el+.0001);vec2 p=d.xz*t/uZ;vec3 gc;
  if(uSc<.5){
   float rip=.008*sin(el*220.+uT*.7+fbm(dz*9.)*6.);
   float rr=rg(dz,.04,.14,4.,2.),mr=1.-smoothstep(rr-.004,rr,(-el+rip)/uZ);
   float sk=fbm(vec2(p.x*1.4,p.y*.35+uT*.5));
   gc=mix(uHor*.9,uTop*.9,.4+.4*sk);
   gc=mix(gc,mix(uInk,uAcc,.35),mr*.55);
   gc=mix(gc,uInk*1.1,smoothstep(-.5,-.62,el+.08*fbm(dz*6.)));
  }else{
   float c=fbm(p*.07+vec2(uT*.01,0.))+.4*fbm(p*.2-uT*.015);
   gc=mix(uHor*.8+uTop*.15,uHor*.35+.65,smoothstep(.45,.95,c));
   if(el<-.8){vec3 rk=mix(uInk*1.6,uHor,.3+.4*fbm(d.xz*9.));gc=mix(gc,rk,smoothstep(-.8,-.9,el));}
  }
  col=mix(gc,uHor,smoothstep(-.06,0.,el)*.95);
 }
 if(uSc<.5){col=layer(col,dz,e,.10,.20,3.,1.,.3);col=layer(col,dz,e,.04,.14,4.,2.,.5);}
 else{col=layer(col,dz,e,.03,.07,4.,1.,.3);col=layer(col,dz,e,-.02,.12,5.,2.,.5);}
 col=mix(col,uHor,exp(-abs(el)*10.)*.35);
 col*=.95+.1*n(vec2(atan(d.x,-d.z)*120.,el*120.));
 gl_FragColor=vec4(col*(1.-uFade),1.);}`;
    const dome = new THREE.Mesh(new THREE.SphereGeometry(30, 40, 24), new THREE.ShaderMaterial({
      uniforms: U,
      vertexShader: 'varying vec3 vD;void main(){vD=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: FS, side: THREE.BackSide, depthWrite: false
    }));
    dome.renderOrder = -1; dome.frustumCulled = false;
    const world = new THREE.Group(); scene.add(world); world.add(dome);
    let yaw3 = 0, zoom = 1, zoomT = 1, paused = false, rotDir = 1;

    /* ---------- canvas panels ---------- */
    function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
    function canvasPanel(wM, hM, wPx, hPx, draw) {
      const cv = document.createElement('canvas'); cv.width = wPx; cv.height = hPx; const ctx = cv.getContext('2d');
      const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false }));
      m.renderOrder = 5; m.userData.redraw = () => { draw(ctx, wPx, hPx); tex.needsUpdate = true; }; m.userData.redraw(); return m;
    }
    function timerText() {
      if (!TIMERS[timerIdx]) return 'Timer: open'; if (timerDone) return 'Timer: done';
      if (!timerEnd) return 'Timer: ' + TIMERS[timerIdx] + ' min';
      const s = Math.max(0, Math.ceil((timerEnd - performance.now()) / 1000)); return 'Timer ' + (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0');
    }
    function timerShort() {
      if (!TIMERS[timerIdx]) return 'Open'; if (timerDone) return 'Done'; if (!timerEnd) return TIMERS[timerIdx] + ' min';
      const t = Math.max(0, Math.ceil((timerEnd - performance.now()) / 1000)); return (t / 60 | 0) + ':' + String(t % 60).padStart(2, '0');
    }
    const BTN = ['Scene', 'Time', 'Music', 'Timer', 'Vol−', 'Vol+', 'Spd−', 'Spd', 'Spd+', 'Pause', 'Dir', 'Zoom−', 'Zoom+', 'Exit'];
    const panel = canvasPanel(1.4, .1, 1792, 128, (c, W, H) => {
      c.clearRect(0, 0, W, H); c.font = 'bold 27px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      BTN.forEach((b, i) => {
        let t = b, on = false, bg = 'rgba(16,21,28,.85)';
        if (b === 'Scene') t = SCENES[sc]; else if (b === 'Time') t = TODS[tod];
        else if (b === 'Music') { t = zenMusicOn ? 'Zen' : 'Nature'; on = zenMusicOn; }
        else if (b === 'Timer') t = timerShort();
        else if (b === 'Spd') t = rotDeg.toFixed(1) + '°/s'; else if (b === 'Pause') { t = paused ? 'Play' : 'Pause'; on = paused; }
        else if (b === 'Dir') t = rotDir > 0 ? 'Dir L' : 'Dir R'; else if (b === 'Exit') bg = 'rgba(170,45,45,.92)';
        c.fillStyle = on ? 'rgba(62,198,168,.92)' : bg; rr(c, i * 128 + 4, 8, 120, 112, 14); c.fill();
        c.fillStyle = on ? '#06201a' : '#e6edf3'; c.fillText(t, i * 128 + 64, 66);
      });
    });
    scene.add(panel);
    function wrap(c, text, maxW) {
      const tk = text.match(/[\u3000-\u9fff\uff00-\uffef]|[^\s\u3000-\u9fff\uff00-\uffef]+\s*/g) || []; const out = []; let l = '';
      for (const t of tk) { if (l && c.measureText(l + t).width > maxW) { out.push(l.trim()); l = t; } else l += t; } if (l) out.push(l.trim()); return out;
    }
    const cap = canvasPanel(2.4, .6, 1024, 256, (c, W, H) => {
      c.clearRect(0, 0, W, H); c.font = "48px 'Noto Serif CJK SC','Noto Serif SC','Songti SC','SimSun','Microsoft YaHei',serif";
      c.fillStyle = '#f4efe4'; c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 10; c.textAlign = 'center'; c.textBaseline = 'middle';
      const L = wrap(c, capText, 940); L.forEach((s, i) => c.fillText(s, W / 2, H / 2 + (i - (L.length - 1) / 2) * 62));
    });
    cap.material.opacity = 0; scene.add(cap);
    function layoutAll() { panel.position.set(0, eyeY - .8, -1); panel.rotation.x = -.6; cap.position.set(0, eyeY + .2, -2.5); }
    layoutAll();

    function paint(w, h, fn) {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; fn(cv.getContext('2d'), w, h); return new THREE.CanvasTexture(cv);
    }
    function prop(tex, wM, hM, az, dist, y, op) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: op || 1, depthWrite: false }));
      m.position.set(Math.sin(az) * dist, y, -Math.cos(az) * dist); m.rotation.y = -az; m.renderOrder = 2; world.add(m); return m;
    }
    const rnd = Math.random;
    const blossomTex = paint(1024, 768, (c, w, h) => {
      c.lineCap = 'round'; c.strokeStyle = '#1d1b1e'; const pts = []; let x = 30, y = h - 20;
      for (let i = 0; i < 14; i++) { c.lineWidth = 26 - i * 1.6; c.beginPath(); c.moveTo(x, y); const nx = x + 40 + rnd() * 35, ny = y - 45 - rnd() * 25; c.quadraticCurveTo(x + 20, y - 30 * rnd() - 20, nx, ny); c.stroke(); x = nx; y = ny; pts.push([x, y]); }
      pts.forEach(([px, py]) => {
        for (let k = 0; k < 30; k++) {
          c.fillStyle = 'rgba(' + (215 + rnd() * 40 | 0) + ',' + (80 + rnd() * 100 | 0) + ',' + (110 + rnd() * 70 | 0) + ',' + (.3 + rnd() * .45) + ')';
          c.beginPath(); c.arc(px + (rnd() - .5) * 190, py + (rnd() - .5) * 150, 5 + rnd() * 17, 0, 7); c.fill();
        }
      });
      for (let k = 0; k < 70; k++) { c.fillStyle = 'rgba(200,40,50,.8)'; c.beginPath(); c.arc(rnd() * w, rnd() * h * .7, 1 + rnd() * 4, 0, 7); c.fill(); }
    });
    const pagodaTex = paint(512, 512, (c) => {
      for (let i = 0; i < 3; i++) {
        const y = 400 - i * 120, wd = 300 - i * 55;
        c.fillStyle = '#a5322e'; c.fillRect(256 - wd * .38, y - 60, wd * .76, 60);
        c.fillStyle = '#2b2a2e'; c.beginPath(); c.moveTo(256 - wd / 2 - 30, y - 52); c.quadraticCurveTo(256 - wd / 2 + 20, y - 50, 256, y - 100);
        c.quadraticCurveTo(256 + wd / 2 - 20, y - 50, 256 + wd / 2 + 30, y - 52); c.quadraticCurveTo(256, y - 70, 256 - wd / 2 - 30, y - 52); c.fill();
      }
      c.fillRect(252, 10, 8, 60);
    });
    const birdsTex = paint(512, 128, (c) => {
      c.strokeStyle = '#1d1b1e'; c.lineWidth = 3;
      for (let i = 0; i < 7; i++) { const x = 40 + rnd() * 430, y = 20 + rnd() * 80; c.beginPath(); c.moveTo(x - 12, y - 6); c.quadraticCurveTo(x - 5, y, x, y + 3); c.quadraticCurveTo(x + 5, y, x + 12, y - 6); c.stroke(); }
    });
    const blossom = prop(blossomTex, 4, 3, -.9, 5, 3.3);
    const pagoda = prop(pagodaTex, 3, 3, -.45, 12, 2.6), pagodaR = prop(pagodaTex, 3, 3, -.45, 12, -2.6, .3); pagodaR.scale.y = -1;
    const birds = prop(birdsTex, 3, .75, .6, 10, 5);

    /* ---------- audio (synthesized) ---------- */
    let AC, master, beds = [], birdBus, musicBus;
    const PENT = [146.83, 164.81, 196.0, 220.0, 246.94, 293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25];
    let pentIdx = 5, pluckCadence = 0;

    function playPluck(freq, t, vel) {
      if (!AC || !zenMusicOn) return;
      t = t || AC.currentTime;
      const osc = AC.createOscillator(), osc2 = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();

        } catch (e) { lastErr = 'reset: ' + e.message; }
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
        renderer.setAnimationLoop(null); renderer.setAnimationLoop(frame);
      }, 150);
    }

    /* ---------- frame loop ---------- */
    let last = performance.now() / 1000, t0 = last, tdraw = 0;
    function frameBody() {
      const now = performance.now() / 1000, dt = Math.min(.1, now - last); last = now; const t = now - t0;
      U.uT.value = t;
      if (pending !== null) { fade += dt / 1.2; if (fade >= 1) { fade = 1; sc = pending; pending = null; U.uSc.value = sc; applySky(); refreshUI(); panel.userData.redraw(); } }
      else if (fade > 0) fade = Math.max(0, fade - dt / 1.2);
      U.uFade.value = fade;
      const k = Math.min(1, dt * 1.5), T = P[tod];
      ['top', 'hor', 'ink', 'sun', 'dir'].forEach(n => U['u' + n[0].toUpperCase() + n.slice(1)].value.lerp(T[n], k));
      U.uNight.value += (T.night - U.uNight.value) * k;
      U.uAcc.value.lerp(ACC[tod], k); const pr = !U.uHas.value; pagoda.visible = pagodaR.visible = pr && sc === 0; blossom.visible = birds.visible = pr;
      U.uTint.value.lerp(skyOwn ? ONE : TINT[tod], k); camera.getWorldDirection(fwdV); U.uPaper.value.lerp(PAPER[tod], k); yaw3 += dt * (paused ? 0 : rotDeg * rotDir) * Math.PI / 180; world.rotation.y = yaw3; galTick(dt);
      U.uYaw.value = yaw3; { const cy = Math.cos(yaw3), sy = Math.sin(yaw3); U.uFwd.value.set(fwdV.x * cy - fwdV.z * sy, fwdV.y, fwdV.x * sy + fwdV.z * cy); }
      birds.position.x = Math.sin(t * .05 + .6) * 10; birds.position.z = -Math.cos(t * .05 + .6) * 10; birds.rotation.y = -(t * .05 + .6);
      if (timerEnd && performance.now() >= timerEnd) { timerEnd = 0; timerDone = true; bell(); }
      panel.visible = panelOn();
      if (panel.visible && now - tdraw > .25) { tdraw = now; panel.userData.redraw(); }
      if (lines.length) {
        const idx = Math.floor(t / CAP_SEC) % lines.length, ph = (t % CAP_SEC) / CAP_SEC;
        if (idx !== capI) { capI = idx; capText = lines[idx]; cap.userData.redraw(); }
        cap.material.opacity = Math.min(1, ph * 5, (1 - ph) * 5);
      } else cap.material.opacity = 0;
      if (!inXR) camera.rotation.set(pitch, yaw, 0);
      const s = renderer.xr.getSession();
      if (s && inXR) {
        let sx = 0, sy = 0, b4 = false, b5 = false;
        for (const src of Array.from(s.inputSources || [])) {
          const gp = src.gamepad; if (!gp) continue; const a = gp.axes;
          const x = Math.abs(a[2] || 0) > Math.abs(a[0] || 0) ? (a[2] || 0) : (a[0] || 0), y = Math.abs(a[3] || 0) > Math.abs(a[1] || 0) ? (a[3] || 0) : (a[1] || 0);
          if (Math.abs(x) > Math.abs(sx)) sx = x; if (Math.abs(y) > Math.abs(sy)) sy = y;
          b4 = b4 || !!(gp.buttons[4] && gp.buttons[4].pressed); b5 = b5 || !!(gp.buttons[5] && gp.buttons[5].pressed);
        }
        if (Math.abs(sx) > .2 && Math.abs(sx) > Math.abs(sy)) yaw3 -= sx * dt * 1.0;
        if (Math.abs(sy) > .3 && Math.abs(sy) > Math.abs(sx)) zoomT = Math.max(.5, Math.min(3, zoomT * (1 - sy * dt * .8)));
        zoom += (zoomT - zoom) * Math.min(1, dt * 6); world.rotation.y = yaw3; U.uZ.value = U.uGal.value ? 1 : zoom; U.uS.value = 1 / zoom;
        if (b5 && !p5) exitVR(); p5 = b5; if (b4 && !p4) step(1); p4 = b4;
      }
      updateAudio();
      renderer.render(scene, camera);
    }

    function frame() {
      frames++;
      try {
        frameBody();
      } catch (e) {
        console.error(e);
        lastErr = e.message;
        try {
          renderer.render(scene, camera);
        } catch (e2) { }
      }
    }
    renderer.setAnimationLoop(frame);
    let lastFrames = -1;
    setInterval(() => {
      const stalled = frames === lastFrames && !inXR;
      if (stalled) { renderer.setAnimationLoop(null); renderer.setAnimationLoop(frame); }
      lastFrames = frames;
      $('dbg').textContent = VERSION + '\nFrames: ' + frames + (stalled ? ' (restarted)' : '') + ' · inXR: ' + inXR + ' · sky: ' + (U.uHas.value ? 'image' : 'procedural') + ' · zoom ' + zoom.toFixed(2) + ' · images ' + GAL.n + ' · next #' + (GAL.next + 1) + (lastErr ? '\nError: ' + lastErr : '');
    }, 500);

  </script>
